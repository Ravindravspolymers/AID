<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AID Quizz</title>
  <meta name="description" content="1000 questions. 10 levels. A real POC to clear each one.">
  <!-- theme-color must be a literal; matches --bg token -->
  <meta name="theme-color" content="#0E1116">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AID Quizz">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts (§6 ASSETS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <!-- Phone column; screens render into #app -->
  <main id="app" class="app" aria-live="polite"></main>

  <!-- Overlay roots: sheet, dialog, toast (managed by ui.js) -->
  <div id="overlay-root"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <noscript>
    <p class="screen-body">AID Quizz needs JavaScript turned on.</p>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
